    <rect x="250" y="344" width="524" height="70" rx="35" fill="#3d100d" opacity="0.92" />
    <rect x="250" y="498" width="174" height="64" rx="32" fill="#49120f" opacity="0.92" />
    <rect x="456" y="498" width="116" height="64" rx="32" fill="#781f17" opacity="0.9" />
    <rect x="604" y="498" width="98" height="64" rx="32" fill="#9d311f" opacity="0.88" />
  </g>

  <g filter="url(#shadow)">
    <circle cx="708" cy="674" r="140" fill="#250b09" />
    <circle cx="708" cy="674" r="104" fill="url(#coin)" />
