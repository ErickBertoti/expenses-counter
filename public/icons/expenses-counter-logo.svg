<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Contador de Despesas</title>
  <desc id="desc">Cartao estilizado em tons vermelhos e ambar para o app de controle de despesas.</desc>
  <defs>
    <linearGradient id="background" x1="160" x2="864" y1="80" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c1712" />
      <stop offset="0.48" stop-color="#2a0d0b" />
      <stop offset="1" stop-color="#130606" />
    </linearGradient>
    <linearGradient id="card" x1="220" x2="804" y1="256" y2="708" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd38c" />
      <stop offset="0.55" stop-color="#f29a4a" />
      <stop offset="1" stop-color="#c94b2b" />
    </linearGradient>
    <linearGradient id="coin" x1="604" x2="848" y1="560" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe0a3" />
      <stop offset="1" stop-color="#f06d35" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#080202" flood-opacity="0.38" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#170706" />
  <rect width="1024" height="1024" rx="232" fill="url(#background)" />
  <path d="M190 798C326 874 542 916 778 820C836 796 884 792 914 802V1024H0V850C46 792 104 750 190 798Z" fill="#210808" opacity="0.62" />

